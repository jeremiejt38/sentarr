[project]
name = "sentarr"
version = "0.1.0"
description = "Dashboard self-hosted de suivi de l'avancement des tâches Plex et de la chaîne d'acquisition *arr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "plexapi>=4.15",
    "watchdog>=5.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.26.0",
    "apprise>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentarr"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "B011", "B027"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
